name: CloudPackage CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run D1 migrations'
        type: boolean
        default: true
      deploy_worker:
        description: 'Deploy Worker API'
        type: boolean
        default: true
      deploy_frontend:
        description: 'Deploy Frontend to Pages'
        type: boolean
        default: true

env:
  PNPM_VERSION: '10'

jobs:
  # ── Type check — runs on every push and PR ──
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cloudpackage/worker exec tsc --noEmit
      - run: pnpm --filter @cloudpackage/frontend exec vue-tsc --noEmit

  # ── Deploy — auto on push to main, manual via workflow_dispatch ──
  deploy:
    needs: typecheck
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -n "${{ secrets.CF_API_TOKEN }}" ] && [ -n "${{ secrets.CF_ACCOUNT_ID }}" ] && [ -n "${{ secrets.JWT_SECRET }}" ] && [ -n "${{ secrets.API_KEY_ENCRYPTION_KEY }}" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "::warning::Required Cloudflare/auth secrets are not set — skipping deployment"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # ── Setup Cloudflare resources (create if not exist) ──
      - name: Setup D1 database
        id: setup-d1
        if: steps.secrets.outputs.ready == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "Looking up D1 database cloudpackage-db..."
          DB_UUID=$(curl -sf "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database" \
            -H "Authorization: Bearer $CF_API_TOKEN" | jq -r '.result[] | select(.name=="cloudpackage-db") | .uuid')
          if [ -z "$DB_UUID" ]; then
            echo "Creating D1 database: cloudpackage-db"
            RESULT=$(curl -sf -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"name":"cloudpackage-db"}')
            echo "$RESULT" | jq .
            DB_UUID=$(echo "$RESULT" | jq -r '.result.uuid')
          else
            echo "D1 database cloudpackage-db already exists (uuid: $DB_UUID)"
          fi
          echo "Injecting database_id into wrangler.toml..."
          export DB_UUID
          python - <<'PY'
          import os
          from pathlib import Path

          db_uuid = os.environ['DB_UUID']
          path = Path('packages/worker/wrangler.toml')
          lines = path.read_text().splitlines()
          output = []
          for index, line in enumerate(lines):
              if line.strip().startswith('database_id ='):
                  continue
              output.append(line)
              if line.strip() == 'database_name = "cloudpackage-db"':
                  output.append(f'database_id = "{db_uuid}"')
          path.write_text('\n'.join(output) + '\n')
          PY
          echo "Updated wrangler.toml with database_id: $DB_UUID"

      - name: Setup R2 bucket
        if: steps.secrets.outputs.ready == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "Checking R2 bucket..."
          BUCKET_EXISTS=$(curl -sf "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/r2/buckets" \
            -H "Authorization: Bearer $CF_API_TOKEN" | jq -r '.result.buckets[] | select(.name=="cloudpackage-files") | .name')
          if [ -z "$BUCKET_EXISTS" ]; then
            echo "Creating R2 bucket: cloudpackage-files"
            curl -sf -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/r2/buckets" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"name":"cloudpackage-files"}' | jq .
          else
            echo "R2 bucket cloudpackage-files already exists"
          fi

      # ── D1 Migrations ──
      - name: Run D1 migrations
        if: steps.secrets.outputs.ready == 'true'
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute cloudpackage-db --remote --file=src/db/migrations/0001_initial.sql

      - name: Bootstrap default admin and storage
        if: steps.secrets.outputs.ready == 'true'
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          USER_COUNT=$(npx wrangler d1 execute cloudpackage-db --remote --command "SELECT COUNT(*) AS count FROM users;" --json | jq -r '.[0].results[0].count')
          if [ "$USER_COUNT" = "0" ]; then
            npx wrangler d1 execute cloudpackage-db --remote --command "INSERT INTO users (id, username, email, password_hash, display_name, role, storage_quota, is_active) VALUES ('00000000-0000-4000-8000-000000000001', 'admin', 'admin@ccb.rip', 'cloudpackage-admin-bootstrap:3fb46f871a66c28cdf0372d9e66172b631832b99c4faede0bfd65aa0ad2249de', 'Administrator', 'admin', 10737418240, 1);"
          else
            echo "Users already exist; skipping default admin bootstrap"
          fi

          STORAGE_COUNT=$(npx wrangler d1 execute cloudpackage-db --remote --command "SELECT COUNT(*) AS count FROM storage_configs;" --json | jq -r '.[0].results[0].count')
          DEFAULT_STORAGE_EXISTS=$(npx wrangler d1 execute cloudpackage-db --remote --command "SELECT COUNT(*) AS count FROM storage_configs WHERE id = '00000000-0000-4000-8000-000000000020' OR (name = 'Cloudflare R2' AND mount_point = '/');" --json | jq -r '.[0].results[0].count')
          if [ "$DEFAULT_STORAGE_EXISTS" = "0" ]; then
            IS_DEFAULT=0
            if [ "$STORAGE_COUNT" = "0" ]; then
              IS_DEFAULT=1
            fi
            npx wrangler d1 execute cloudpackage-db --remote --command "INSERT INTO storage_configs (id, name, driver, is_default, is_active, config_json, mount_point, priority, created_by) VALUES ('00000000-0000-4000-8000-000000000020', 'Cloudflare R2', 'r2', $IS_DEFAULT, 1, '{\"binding\":\"BUCKET\"}', '/', 0, NULL);" || npx wrangler d1 execute cloudpackage-db --remote --command "INSERT INTO storage_configs (id, name, driver, is_default, is_active, config_json, mount_point, priority, created_by) VALUES ('00000000-0000-4000-8000-000000000020', 'Cloudflare R2', 's3', $IS_DEFAULT, 1, '{\"binding\":\"BUCKET\"}', '/', 0, NULL);"
          else
            echo "Default R2 storage config already exists"
          fi

      - name: Sync Worker secrets
        if: steps.secrets.outputs.ready == 'true'
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          API_KEY_ENCRYPTION_KEY: ${{ secrets.API_KEY_ENCRYPTION_KEY }}
        run: |
          printf '%s' "$JWT_SECRET" | npx wrangler secret put JWT_SECRET --env production
          printf '%s' "$API_KEY_ENCRYPTION_KEY" | npx wrangler secret put API_KEY_ENCRYPTION_KEY --env production

      - name: Clean probe users
        if: steps.secrets.outputs.ready == 'true'
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute cloudpackage-db --remote --command "DELETE FROM users WHERE username LIKE '__probe_admin_bootstrap%';"

      # ── Deploy Worker ──
      - name: Deploy Worker API
        if: steps.secrets.outputs.ready == 'true'
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --env production

      # ── Build & Deploy Frontend ──
      - name: Build Frontend
        if: steps.secrets.outputs.ready == 'true'
        env:
          VITE_API_BASE_URL: https://cloudpackage-api-production.yimoex.workers.dev/api
        run: pnpm --filter @cloudpackage/frontend build

      - name: Setup Pages project
        if: steps.secrets.outputs.ready == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "Checking Pages project..."
          PROJECT_EXISTS=$(curl -sf "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects" \
            -H "Authorization: Bearer $CF_API_TOKEN" | jq -r '.result[] | select(.name=="cloudpackage") | .name')
          if [ -z "$PROJECT_EXISTS" ]; then
            echo "Creating Pages project: cloudpackage"
            curl -sf -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"name":"cloudpackage","production_branch":"main"}' | jq .
          else
            echo "Pages project cloudpackage already exists"
          fi

      - name: Deploy Frontend to Pages
        if: steps.secrets.outputs.ready == 'true'
        working-directory: packages/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist --project-name=cloudpackage --branch=main --commit-dirty=true
