name: CloudPackage CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run D1 migrations'
        type: boolean
        default: true
      deploy_worker:
        description: 'Deploy Worker API'
        type: boolean
        default: true
      deploy_frontend:
        description: 'Deploy Frontend to Pages'
        type: boolean
        default: true

env:
  PNPM_VERSION: '10'

jobs:
  # ── Type check — runs on every push and PR ──
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cloudpackage/worker exec tsc --noEmit
      - run: pnpm --filter @cloudpackage/frontend exec vue-tsc --noEmit

  # ── Deploy — auto on push to main, manual via workflow_dispatch ──
  deploy:
    needs: typecheck
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -n "${{ secrets.CF_API_TOKEN }}" ] && [ -n "${{ secrets.CF_ACCOUNT_ID }}" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "::warning::CF_API_TOKEN or CF_ACCOUNT_ID secret not set — skipping deployment"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # ── Setup Cloudflare resources (create if not exist) ──
      - name: Setup D1 database
        if: steps.secrets.outputs.ready == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "Checking D1 database..."
          DB_EXISTS=$(curl -sf "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database" \
            -H "Authorization: Bearer $CF_API_TOKEN" | jq -r '.result[] | select(.name=="cloudpackage-db") | .name')
          if [ -z "$DB_EXISTS" ]; then
            echo "Creating D1 database: cloudpackage-db"
            curl -sf -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"name":"cloudpackage-db"}' | jq .
          else
            echo "D1 database cloudpackage-db already exists"
          fi

      - name: Setup R2 bucket
        if: steps.secrets.outputs.ready == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "Checking R2 bucket..."
          BUCKET_EXISTS=$(curl -sf "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/r2/buckets" \
            -H "Authorization: Bearer $CF_API_TOKEN" | jq -r '.result.buckets[] | select(.name=="cloudpackage-files") | .name')
          if [ -z "$BUCKET_EXISTS" ]; then
            echo "Creating R2 bucket: cloudpackage-files"
            curl -sf -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/r2/buckets" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"name":"cloudpackage-files"}' | jq .
          else
            echo "R2 bucket cloudpackage-files already exists"
          fi

      # ── D1 Migrations ──
      - name: Run D1 migrations
        if: steps.secrets.outputs.ready == 'true'
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute cloudpackage-db --remote --file=src/db/migrations/0001_initial.sql

      # ── Deploy Worker ──
      - name: Deploy Worker API
        if: steps.secrets.outputs.ready == 'true'
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --env production

      # ── Build & Deploy Frontend ──
      - name: Build Frontend
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm --filter @cloudpackage/frontend build

      - name: Deploy Frontend to Pages
        if: steps.secrets.outputs.ready == 'true'
        working-directory: packages/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist --project-name=cloudpackage --branch=main
